server {
    listen 80;
    location /api/v1/auth/ {
        proxy_pass ${AUTH_API_URL}/api/v1/auth/;
    }
    location /api/v1/users/ {
        proxy_pass ${AUTH_API_URL}/api/v1/users/;
    }
    location /api/v1/ {
        proxy_pass ${TODO_API_URL}/api/v1/;
    }
    location / {
        root /usr/share/nginx/html;
        include /etc/nginx/mime.types;
        try_files $uri $uri/ /index.html;
    }
}
