services:
  ingress:
    image: compute-unit
    platform: ${COMPUTE_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: ${COMPUTE_DOCKERFILE:-Dockerfile.x86}
      args:
        INGRESS_URL: ${INGRESS_URL}
    environment:
      TO_DO_DB_URL: ${TODO_DOCKER_DB_URL}
      AUTH_DB_URL: ${AUTH_DOCKER_DB_URL}
      CACHE_API_URL: ${CACHE_DOCKER_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "8001:8001"

    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    container_name: "nginx"
    image: "nginx:latest"
    ports:
      - "80:80"
    environment:
      INGRESS_API_URL: ${INGRESS_DOCKER_API_URL}
    volumes:
      - ./ingress/nginx.conf:/etc/nginx/templates/default.conf.template:ro
