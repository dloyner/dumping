# deployment/nginx.conf
# Mounted as the complete /etc/nginx/nginx.conf (not a template), so $variables are nginx's own.
worker_processes auto;

events {
    worker_connections 512;
}

http {
    server_tokens off;
    client_max_body_size 1m;

    # Docker's embedded DNS. Resolving at request time means nginx keeps working
    # when the ingress container is recreated and gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location / {
            set $upstream http://ingress:8001;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
