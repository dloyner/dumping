# nanoservices/to_do/build-config.yml
services:
  to_do:
    image: compute-unit
    environment:
      TO_DO_WEB_HOST: 0.0.0.0
      TO_DO_DB_URL: ${TODO_DOCKER_DB_URL}
      AUTH_API_URL: ${AUTH_DOCKER_API_URL}
      CACHE_API_URL: ${CACHE_DOCKER_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8080:8080"
    command: ["to-do-axum-server"]

    depends_on:
      postgres:
        condition: service_healthy
