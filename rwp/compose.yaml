services:
  postgres:
    container_name: "to-do-postgres"
    image: "postgres:18"
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-auth-db.sql:/docker-entrypoint-initdb.d/10-auth-db.sql:ro
    environment:
      - "POSTGRES_USER=username"
      - "POSTGRES_DB=to_do"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d to_do"]
      interval: 2s
      timeout: 3s
      retries: 30

  cache:
    container_name: "to-do-redis"
    build:
      context: .
      dockerfile: nanoservices/user-session-cache/cache-module/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--loadmodule", "./libcache_module.so", "--requirepass", "${REDIS_PASSWORD:-local-dev-password-change-me}"]

volumes:
  postgres_data:
