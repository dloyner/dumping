[package]
name = "server"
version = "0.1.0"
edition.workspace = true

[dependencies]
axum = "0.8.9"
redis = { version = "1.8.2", features = ["aio", "tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
kernel = { path = "../kernel/" }
